name: 发布 LifePlan

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: lifeplan-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验版本并生成更新日志
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
      date: ${{ steps.context.outputs.date }}
    steps:
      - name: 检出标签代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 生成发布上下文
        id: context
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release/prepare-release.mjs \
            --tag "$GITHUB_REF_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --context-file release-context.json \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: 提交自动更新的 CHANGELOG
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: 自动更新 CHANGELOG $TAG [skip changelog]"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"

      - name: 上传发布上下文
        uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: release-context.json
          if-no-files-found: error

  build:
    name: 构建 ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: ""
            artifact_name: release-windows-x64
          - platform: macOS Apple Silicon
            runner: macos-14
            rust_target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            artifact_name: release-macos-arm64
          - platform: macOS Intel
            runner: macos-14
            rust_target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            artifact_name: release-macos-x64
    steps:
      - name: 检出标签代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建 Tauri 产物
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build ${{ matrix.args }}

      - name: 收集 Windows 发布资产
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $assets = Get-ChildItem -Path src-tauri/target -Recurse -File |
            Where-Object {
              $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' -and
              ($_.Name -match '\.exe$' -or $_.Name -match '\.nsis\.zip(?:\.sig)?$')
            }
          if (-not $assets) { throw '未找到 Windows NSIS 安装包或更新包。' }
          $assets | Copy-Item -Destination release-assets -Force

      - name: 收集 macOS 发布资产
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          copy_with_target_suffix() {
            local source="$1"
            local name
            local stem
            local extension
            name="$(basename "$source")"
            if [[ "$name" == *aarch64* || "$name" == *arm64* || "$name" == *x86_64* || "$name" == *x64* ]]; then
              cp "$source" "release-assets/$name"
              return
            fi
            if [[ "$name" == *.app.tar.gz.sig ]]; then
              stem="${name%.app.tar.gz.sig}"
              extension=".app.tar.gz.sig"
            elif [[ "$name" == *.app.tar.gz ]]; then
              stem="${name%.app.tar.gz}"
              extension=".app.tar.gz"
            else
              stem="${name%.dmg}"
              extension=".dmg"
            fi
            cp "$source" "release-assets/${stem}_${RUST_TARGET}${extension}"
          }
          while IFS= read -r -d '' file; do
            copy_with_target_suffix "$file"
          done < <(
            find src-tauri/target -type f \( \
              \( -path '*/bundle/dmg/*' -a -name '*.dmg' \) -o \
              \( -path '*/bundle/macos/*' -a \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) \) \
            \) -print0
          )
          if ! find release-assets -maxdepth 1 -type f -print -quit | grep -q .; then
            echo '未找到 macOS DMG 安装包或更新包。' >&2
            exit 1
          fi

      - name: 上传构建资产
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets
          if-no-files-found: error

  publish:
    name: 汇总并发布 GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: 下载发布上下文
        uses: actions/download-artifact@v4
        with:
          name: release-context
          path: release-context

      - name: 整理发布上下文
        shell: bash
        run: |
          set -euo pipefail
          if [ -f release-context.json ]; then
            mkdir -p release-context
            mv release-context.json release-context/release-context.json
          fi
          test -f release-context/release-context.json

      - name: 下载全部构建资产
        uses: actions/download-artifact@v4
        with:
          pattern: release-{windows-x64,macos-arm64,macos-x64}
          path: downloaded-assets
          merge-multiple: false

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 检出发布脚本
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 校验资产并生成 Release 正文
        run: |
          node scripts/release/validate-release-assets.mjs \
            --context-file release-context/release-context.json \
            --assets-dir downloaded-assets \
            --output-dir release-upload \
            --body-file release-body.md

      - name: 创建或更新 Release 并上传资产
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "LifePlan $TAG" --notes-file release-body.md --latest
          else
            gh release create "$TAG" --title "LifePlan $TAG" --notes-file release-body.md --latest
          fi
          gh release upload "$TAG" release-upload/* --clobber
