name: 构建 macOS ZIP

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: 构建 macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-apple-darwin
          - arch: x64
            rust_target: x86_64-apple-darwin

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建 macOS 应用
        run: npm run tauri -- build --target ${{ matrix.rust_target }} --bundles app

      - name: 压缩 APP
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos"
          app_path="$bundle_dir/LifePlan.app"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "LifePlan-macos-${{ matrix.arch }}.zip"

      - name: 上传 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LifePlan-macos-${{ matrix.arch }}
          path: LifePlan-macos-${{ matrix.arch }}.zip
          if-no-files-found: error

      - name: 上传 Release 资产
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LifePlan-macos-${{ matrix.arch }}.zip


