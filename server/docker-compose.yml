services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeplan
      POSTGRES_USER: lifeplan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-feedback-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeplan -d lifeplan"]
      interval: 5s
      timeout: 5s
      retries: 10

  feedback-api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lifeplan:${POSTGRES_PASSWORD}@db:5432/lifeplan
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"

volumes:
  postgres_data:
